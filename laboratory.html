<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Jihun Chae Simulations - an interactive hub of AI agents, games, reinforcement learning, physics, and 3D simulations." />
  <meta property="og:title" content="Jihun Chae | Simulations" />
  <meta property="og:description" content="Interactive models in agent behavior, games, learning, physics, and generative systems." />
  <meta property="og:image" content="https://ji-hun-git.github.io/lab/assets/lab-hero-field-og.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://ji-hun-git.github.io/lab/assets/lab-hero-field-og.jpg" />
  <title>Jihun Chae | Simulations</title>
  <link rel="canonical" href="https://ji-hun-git.github.io/laboratory.html" />
  <!-- Fonts come from jsdelivr, not Google Fonts, for the reason index.html
       records at its own font block: a stylesheet from fonts.googleapis.com plus
       its font files from fonts.gstatic.com hand every visitor's IP address to a
       third party on every page load, before the visitor has clicked anything.
       This page does genuinely need both faces - lab.css:34-35 set
       --display: Fraunces and --sans: Inter - so they are served from
       cdn.jsdelivr.net instead, the one CDN this site already depends on for
       KaTeX. Net effect: two fewer origins see the visitor, and no new one.
       The @fontsource-variable builds carry weights 100-900 in a single file,
       covering every weight the old Google URL asked for (400/500/600/700) in
       one request instead of two. Keep lab.css:34-35 naming the "* Variable"
       families first, or these files download and nothing uses them. -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5/index.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/fraunces@5/index.css" />
  <!-- Same monogram as index.html:26, inline so it costs no request. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317181b'/%3E%3Ctext x='32' y='43' font-family='Inter,Arial,sans-serif' font-size='28' font-weight='700' fill='%23f6f5f2' text-anchor='middle'%3EJC%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" />
  <link rel="stylesheet" href="lab/lab.css?v=20260820c" />
</head>
<body>
  <div class="lab-shell">
    <header class="lab-nav" aria-label="Site header">
      <a href="index.html" class="brand-link">
        <span class="brand-text">
          <!-- h1, not span: this is the page's one top-level heading. Without it
               the document opened at h2 and a screen-reader user landing here
               had no title to orient on. Styling is unchanged - .brand-title
               carries it, and lab.css resets heading margins. -->
          <h1 class="brand-title">Simulations</h1>
          <span class="brand-sub">Interactive models in agent behavior, games, learning, and physics</span>
        </span>
      </a>
      <div class="nav-readout">
        <span class="nav-aff">Jihun Chae &middot; KAIST GSCT</span>
      </div>
      <div class="lab-actions">
        <!-- ?view=cv is required: index.html defaults data-view to 'library'
             (index.html:62-64), so a bare index.html link labelled "View CV"
             landed on the bookshelf instead. -->
        <a class="text-link" href="index.html?view=cv">View CV &rarr;</a>
      </div>
    </header>

    <main>
      <section class="console" id="console">
        <aside class="console-rail" aria-label="Experiment registry">
          <div class="rail-head">
            <p class="eyebrow">Index</p>
            <h2>Catalogue of experiments</h2>
            <div class="rail-stats">
              <span><strong id="metricProjects">0</strong> sims</span>
              <span><strong id="metricRenderers">0</strong> renderers</span>
              <span><strong id="metricLive">0</strong> live</span>
            </div>
            <div class="rail-visual" aria-hidden="true"></div>
            <div class="rail-filter" id="railFilter"></div>
          </div>
          <div class="project-list" id="projectCards"></div>
        </aside>

        <section class="console-stage" aria-label="Simulation stage">
          <div id="viewportMount"></div>
          <div class="detail-grid" id="detailMount"></div>
        </section>

        <aside class="control-panel console-controls" id="controlMount" aria-label="Controls and parameters"></aside>
      </section>
    </main>

    <footer class="footer">
      <span>Jihun Chae &middot; KAIST Graduate School of Culture Technology</span>
      <span>Human-AI Interaction &middot; Game AI &middot; Ludic AI</span>
    </footer>
  </div>

  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>
  <script type="module" src="lab/lab.js?v=20260820c"></script>
</body>
</html>
